name: Build LockRec Controller
on:
  workflow_dispatch:
  push:
    paths:
      - 'controller/**'
      - '.github/workflows/controller.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p controller :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LockRec-Controller-v0.3-beta
          path: controller/app/build/outputs/apk/debug/app-debug.apk
