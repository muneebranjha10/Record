name: Build LockRec APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'controller/**'
      - '.github/workflows/controller.yml'
permissions:
  contents: write
concurrency:
  group: lockrec-apk-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
      - name: Compile and sign without Gradle
        shell: bash
        run: |
          set -euo pipefail
          SRC=controller/app/src/main
          BT="$ANDROID_HOME/build-tools/35.0.0"
          JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          OUT="$RUNNER_TEMP/lockrec-build"
          mkdir -p "$OUT/classes" "$OUT/dex"
          find "$SRC/java" -name '*.java' > "$OUT/sources.txt"
          javac --release 8 -encoding UTF-8 -classpath "$JAR" -d "$OUT/classes" @"$OUT/sources.txt"
          jar cf "$OUT/classes.jar" -C "$OUT/classes" .
          "$BT/d8" --min-api 26 --lib "$JAR" --output "$OUT/dex" "$OUT/classes.jar"
          "$BT/aapt2" link -I "$JAR" --manifest "$SRC/AndroidManifest.xml" --min-sdk-version 26 --target-sdk-version 34 --version-code 9 --version-name 0.9-beta --rename-manifest-package org.lockrec.controller -o "$OUT/unsigned.apk"
          (cd "$OUT/dex" && zip -q -j "$OUT/unsigned.apk" classes*.dex)
          "$BT/zipalign" -f 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          keytool -genkeypair -keystore "$OUT/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BT/apksigner" sign --ks "$OUT/debug.keystore" --ks-pass pass:android --key-pass pass:android --out LockRec-v0.9-beta.apk "$OUT/aligned.apk"
          "$BT/apksigner" verify --verbose LockRec-v0.9-beta.apk
          "$BT/aapt" dump badging LockRec-v0.9-beta.apk | sed -n '1,12p'
      - name: Package matching root module
        run: |
          set -e
          for f in action.sh customize.sh uninstall.sh; do sh -n "$f"; done
          chmod +x action.sh customize.sh uninstall.sh
          zip LockRec-Universal-v0.8-beta.zip module.prop action.sh customize.sh uninstall.sh README.md skip_mount
          unzip -t LockRec-Universal-v0.8-beta.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LockRec-v0.9-beta
          path: |
            LockRec-v0.9-beta.apk
            LockRec-Universal-v0.8-beta.zip
      - name: Publish verified APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.9-beta >/dev/null 2>&1; then
            gh release upload v0.9-beta LockRec-v0.9-beta.apk LockRec-Universal-v0.8-beta.zip --clobber
          else
            gh release create v0.9-beta LockRec-v0.9-beta.apk LockRec-Universal-v0.8-beta.zip --target "$GITHUB_SHA" --prerelease --title "LockRec Night Edition v0.9 Beta" --notes "Experimental debug-signed APK. Root mode needs module v0.8. Animated mascot, compact controller and optional pre-recording toolbar hide. Selectable resolution and conditional FPS controls. Actual FPS varies. Pause creates separate clips. Hardware testing pending."
          fi
